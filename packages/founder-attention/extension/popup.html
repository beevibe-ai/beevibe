<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        font-size: 13px;
        background: #15202b;
        color: #e7e9ea;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; margin-bottom: 4px; color: #8b98a5; font-size: 12px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        background: #243340;
        border: 1px solid #2f3336;
        color: #e7e9ea;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      button {
        background: #1d9bf0;
        color: white;
        border: 0;
        padding: 6px 12px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
      }
      .hint { color: #8b98a5; font-size: 11px; margin-top: 8px; line-height: 1.4; }
      .ok { color: #00ba7c; margin-left: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Founder Attention Agent</h1>
    <label for="backend">Backend URL</label>
    <input id="backend" type="text" placeholder="http://localhost:8787" />
    <button id="save">Save</button>
    <span id="saved" class="ok"></span>
    <div class="hint">
      Open x.com, scroll the timeline, then click <b>Scan feed</b> in the panel.
      All drafts are copy-to-clipboard. You always post manually.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
