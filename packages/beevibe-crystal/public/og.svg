<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181d2c"/>
      <stop offset="55%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#050609"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#dde3ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#b9c5ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7d9bff" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="highlight" cx="35%" cy="30%" r="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="50%" stop-color="#b9c5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b9c5ff" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint stars -->
  <g fill="#ffffff">
    <circle cx="150" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="180" r="1.0" opacity="0.4"/>
    <circle cx="420" cy="80" r="1.3" opacity="0.55"/>
    <circle cx="1080" cy="420" r="1.1" opacity="0.45"/>
    <circle cx="120" cy="510" r="1.0" opacity="0.4"/>
    <circle cx="780" cy="540" r="1.2" opacity="0.5"/>
    <circle cx="280" cy="320" r="0.9" opacity="0.35"/>
  </g>

  <!-- ambient glow behind orb -->
  <circle cx="600" cy="315" r="280" fill="url(#glow)"/>

  <!-- the orb -->
  <circle cx="600" cy="315" r="210" fill="url(#orb)"/>
  <circle cx="540" cy="245" r="55" fill="url(#highlight)"/>

  <!-- equator crack (single subtle ring) -->
  <ellipse cx="600" cy="315" rx="208" ry="10" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <text x="600" y="560" fill="#ecf0fa" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="600" text-anchor="middle">Beevibe Crystal</text>
  <text x="600" y="596" fill="#a8b1c4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle">via github.com/beevibe-ai/beevibe</text>
</svg>
